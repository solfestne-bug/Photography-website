<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | Sunfest Photography</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="Photowebsite.html" aria-label="Go to the home page">
        <div class="logo">
          <img src=".//Photos for site/CEC11EE0-8C69-4862-8552-D9A88CEC6F9B.png" alt="Sunfest Photos logo" />
        </div>
        <div>
          <p class="eyebrow"></p>
          <h1>Sunfest Photography</h1>
        </div>
      </a>
      <nav class="site-nav">
        <a href="Photowebsite.html">Home</a>
        <a href="Photowebsite.html#portfolio">Portfolio</a>
        <a href="Photowebsite.html#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section portfolio-section gallery-section">
      <div class="container">
        <div class="section-header">
          <p class="eyebrow">Portfolio</p>
          <h2>Gallery</h2>
          <p class="page-intro">Choose a gallery from the portfolio to view the rotating collection.</p>
        </div>
        <div class="gallery-page-actions">
          <a class="button button-secondary" href="Photowebsite.html#portfolio">Back to Portfolio</a>
        </div>

        <div class="carousel" aria-label="Gallery carousel">
          <div class="carousel-track">
            <div class="carousel-slide current-slide">
              <img src="./Photos for site/IMG_5448.jpeg" alt="Gallery preview" />
            </div>
          </div>
          <button class="carousel-button carousel-button--prev" aria-label="Previous slide">&#x2190;</button>
          <button class="carousel-button carousel-button--next" aria-label="Next slide">&#x2192;</button>
          <div class="carousel-indicators">
            <button class="carousel-indicator active" aria-label="Slide 1"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Sunfest Photography</p>
      <p></p>
    </div>
  </footer>

  <script src="pet-gallery.js"></script>
  <script src="script.js"></script>
</body>
</html>
