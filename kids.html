<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids | Sunfest Photography</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="Photowebsite.html" aria-label="Go to the home page">
        <div class="logo">
          <img src="./Photos for site/CEC11EE0-8C69-4862-8552-D9A88CEC6F9B.png" alt="Sunfest Photos logo" />
        </div>
        <div>
          <p class="eyebrow"></p>
          <h1>Sunfest Photography</h1>
        </div>
      </a>
      <nav class="site-nav">
        <a href="Photowebsite.html">Home</a>
        <a href="Photowebsite.html#portfolio">Portfolio</a>
        <a href="Photowebsite.html#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section portfolio-section">
      <div class="container">
        <div class="section-header">
          <p class="eyebrow">Portfolio</p>
          <h2>Kids</h2>
          <p class="page-intro">Bright, playful photography that celebrates energy, wonder, and the fun of childhood.</p>
        </div>
        <div class="gallery-page-actions">
          <a class="button button-secondary" href="Photowebsite.html#portfolio">Back to Portfolio</a>
        </div>
        <div class="carousel" aria-label="Kids carousel">
          <div class="carousel-track">
            <div class="carousel-slide current-slide">
              <img src="./kids photos/IMG_4218.jpeg" alt="Kids portrait sample" />
            </div>
            <div class="carousel-slide current-slide">
              <img src="./kids photos/5AEAF336-98A0-4446-AC49-350B870977FC_1_105_c.jpeg" alt="Kids portrait sample" />
            </div>
            <div class="carousel-slide current-slide">
              <img src="./kids photos/IMG_4220.jpeg" alt="Kids portrait sample" />
            </div>
            <div class="carousel-slide current-slide">
              <img src="./kids photos/IMG_5349.jpeg" alt="Kids portrait sample" />
            </div>
          </div>
          <button class="carousel-button carousel-button--prev" aria-label="Previous slide">&#x2190;</button>
          <button class="carousel-button carousel-button--next" aria-label="Next slide">&#x2192;</button>
          <div class="carousel-indicators">
            <button class="carousel-indicator active" aria-label="Slide 1"></button>
            <button class="carousel-indicator" aria-label="Slide 2"></button>
            <button class="carousel-indicator" aria-label="Slide 3"></button>
            <button class="carousel-indicator" aria-label="Slide 4"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Sunfest Photography</p>
      <p></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
