<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Headshots | Sunfest Photography</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="Photowebsite.html" aria-label="Go to the home page">
        <div class="logo">
          <img src="./Photos for site/CEC11EE0-8C69-4862-8552-D9A88CEC6F9B.png" alt="Sunfest Photos logo" />
        </div>
        <div>
          <p class="eyebrow"></p>
          <h1>Sunfest Photography</h1>
        </div>
      </a>
      <nav class="site-nav">
        <a href="Photowebsite.html">Home</a>
        <a href="Photowebsite.html#portfolio">Portfolio</a>
        <a href="Photowebsite.html#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section portfolio-section">
      <div class="container">
        <div class="section-header">
          <p class="eyebrow">Portfolio</p>
          <h2>Headshots</h2>
          <p class="page-intro">Professional headshots and personal branding imagery that highlight confidence, clarity, and personality.</p>
        </div>
        <div class="gallery-page-actions">
          <a class="button button-secondary" href="Photowebsite.html#portfolio">Back to Portfolio</a>
        </div>
        <div class="carousel" aria-label="Headshots carousel">
          <div class="carousel-track">
            <div class="carousel-slide current-slide">
              <img src="./headshots/IMG_7702.jpg" alt="Headshot sample" />
            </div>
            <div class="carousel-slide">
              <img src="./headshots/A2130162-8EE6-448E-A94B-2FF33DB3C445_1_105_c.jpeg" alt="Headshot sample" />
            </div>
            <div class="carousel-slide">
              <img src="./headshots/IMG_7707.jpg" alt="Headshot sample" />
            </div>
            <div class="carousel-slide">
              <img src="./headshots/IMG_7705.jpg" alt="Headshot sample" />
            </div>
             <div class="carousel-slide">
              <img src="./headshots/IMG_7727.jpg" alt="Headshot sample" />
            </div>
             <div class="carousel-slide">
              <img src="./headshots/IMG_7732.jpg" alt="Headshot sample" />
            </div>
             <div class="carousel-slide">
              <img src="./headshots/C448789C-B4AA-42FE-BBA2-94A82414F759_1_201_a.jpeg" alt="Headshot sample" />
            </div>
            <div class="carousel-slide">
              <img src="./headshots/DSC07719.JPG" alt="Headshot sample" />
            </div>
            <div class="carousel-slide">
              <img src="./headshots/DSC07821.JPG" alt="Headshot sample" />
            </div>
            <div class="carousel-slide">
              <img src="./headshots/IMG_7547.jpg" alt="Headshot sample" />
            </div>
            <div class="carousel-slide">
              <img src="./headshots/IMG_7733.jpg" alt="Headshot sample" />
            </div>
          <button class="carousel-button carousel-button--prev" aria-label="Previous slide">&#x2190;</button>
          <button class="carousel-button carousel-button--next" aria-label="Next slide">&#x2192;</button>
          <div class="carousel-indicators">
            <button class="carousel-indicator active" aria-label="Slide 1"></button>
            <button class="carousel-indicator" aria-label="Slide 2"></button>
            <button class="carousel-indicator" aria-label="Slide 3"></button>
            <button class="carousel-indicator" aria-label="Slide 4"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Sunfest Photography</p>
      <p></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
